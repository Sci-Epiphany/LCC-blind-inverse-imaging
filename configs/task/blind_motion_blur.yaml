# pixel space task
pixel:
  mcmc_sampler_config:
    num_steps: 100
    lr:
      image: 3.92e-5   # if tau=0.01: 3.92e-5         # if tau=0.02:  motion 1e-4
      kernel: 3.33e-9   # 3.33e-9                                        # motion 1e-8
    tau: 0.01          # 0.02
    lr_min_ratio:
      image: 0.01
      kernel: 0.01
    mc_algo: langevin
    prior_solver:
      image: gaussian
      kernel: gaussian
    reg_terms:
      lamb: 35        # 35               # 5e-1
      beta: 2e7       # 2e7              # 4.6e6
    kernel_regularizer: pnp

  operator:
    name: blind_blur
    kernel_size: 64
    intensity: 0.5        #  motion 0.5  gaussian 3.0
    sigma: 0.01         # 0.02

# latent diffusion model
ldm:
  mcmc_sampler_config:
    num_steps: 35
    lr: 2.70e-6
    tau: 0.01
    lr_min_ratio: 0.95
    momentum: 0.9500
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: blind_blur
    kernel_size: 64
    intensity: 3.0
    sigma: 0.05

# stable diffusion
sd:
  mcmc_sampler_config:
    num_steps: 40
    lr: 1e-5
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.9
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: blind_blur
    kernel_size: 64
    intensity: 3.0
    sigma: 0.01
