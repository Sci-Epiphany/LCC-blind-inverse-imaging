# pixel space task
pixel:
  mcmc_sampler_config:
    num_steps: 100
    lr:
      image: 5e-5
      kernel: 4e-9

    tau: 0.02
    lr_min_ratio:
      image: 0.01
      kernel: 0.01
    mc_algo: langevin
    prior_solver:
      image: gaussian
      kernel: gaussian
    reg_terms:
      lamb: 3.5e1
      beta: 0.5e6
    kernel_regularizer: pnp

  operator:
    name: blind_blur
    kernel_size: 64
    intensity: 3.0
    sigma: 0.02

# latent diffusion model
ldm:
  mcmc_sampler_config:
    num_steps: 35
    lr: 2.70e-6
    tau: 0.01
    lr_min_ratio: 0.95
    momentum: 0.95
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: blind_blur
    kernel_size: 64
    intensity: 3.0
    sigma: 0.05

# stable diffusion
sd:
  mcmc_sampler_config:
    num_steps: 40
    lr: 1e-5
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.9
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: blind_blur
    kernel_size: 64
    intensity: 3.0
    sigma: 0.01
