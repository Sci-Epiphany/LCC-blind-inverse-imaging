# pixel space task
pixel:
  mcmc_sampler_config:
    num_steps: 100
    lr:
      image: 3e-5
      kernel: 2e-9

    tau: null
    lr_min_ratio:
      image: 0.01
      kernel: 0.01
    mc_algo: langevin
    prior_solver: gaussian
    reg_terms:
      lamb: 3e2
      beta: 2e7
    kernel_prior_weight: 1e4
    kernel_trajectory: mcmc
    kernel_noise_scale: 0.1
    image_noise_scale: 1.0
    auto_lr_kernel: true
    return_clean: true

  operator:
    name: blind_nonlinear_blur
    opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
    sigma: 0.02
    proposal_mode: sample
    proposal_candidates: 1
    proposal_noise_scale: 1.0

# latent diffusion model
ldm:
  mcmc_sampler_config:
    num_steps: 35
    lr: 2.70e-6
    tau: 0.01
    lr_min_ratio: 0.95
    momentum: 0.95
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: blind_nonlinear_blur
    opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
    sigma: 0.02

# stable diffusion
sd:
  mcmc_sampler_config:
    num_steps: 40
    lr: 1e-5
    tau: 0.01
    lr_min_ratio: 1
    momentum: 0.9
    mc_algo: hmc
    prior_solver: gaussian

  operator:
    name: blind_nonlinear_blur
    opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
    sigma: 0.02
