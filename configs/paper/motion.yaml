gpu: 1
batch_size: 32
num_runs: 1
save_dir: results
name: motion_blur_demo
wandb: false
save_samples: true
save_traj: false
save_traj_raw_data: false
show_eval: false
image_eval_fn_list:
- psnr
- lpips
- ssim
kernel__eval_fn_list:
- kernel_mse
task_group: pixel
project_name: BlindDAPS
seed: 123
data:
  name: image
  root: dataset/test-ffhq
  resolution: 256
  start_id: 40
  end_id: 72
kernel_data:
  name: motion_blur
  kernel_size: 64
  intensity: 0.5
  sigma: 0.02
model:
  name: ddpm
  model_config:
    image_size: 256
    num_channels: 128
    num_res_blocks: 1
    channel_mult: ''
    learn_sigma: true
    class_cond: false
    use_checkpoint: false
    attention_resolutions: 16
    num_heads: 4
    num_head_channels: 64
    num_heads_upsample: -1
    use_scale_shift_norm: true
    dropout: 0.0
    resblock_updown: true
    use_fp16: false
    use_new_attention_order: false
    model_path: checkpoints/ffhq256.pt
kernel_model:
  name: ddpm
  model_config:
    image_size: 64
    num_channels: 64
    num_res_blocks: 1
    channel_mult: ''
    learn_sigma: true
    class_cond: false
    use_checkpoint: false
    attention_resolutions: 16
    num_heads: 4
    num_head_channels: 64
    num_heads_upsample: -1
    use_scale_shift_norm: true
    dropout: 0.0
    resblock_updown: true
    use_fp16: false
    use_new_attention_order: false
    grayscale: true
    model_path: checkpoints/kernel_checkpoint.pt
task:
  pixel:
    mcmc_sampler_config:
      num_steps: 100
      lr:
        image: 3.92e-05
        kernel: 3.33e-09
      tau: 0.01
      lr_min_ratio:
        image: 0.01
        kernel: 0.01
      mc_algo: langevin
      prior_solver:
        image: gaussian
        kernel: gaussian
      reg_terms:
        lamb: 35
        beta: 20000000.0
    operator:
      name: blind_blur
      kernel_size: 64
      intensity: 0.5
      sigma: 0.01
  ldm:
    mcmc_sampler_config:
      num_steps: 35
      lr: 2.7e-06
      tau: 0.01
      lr_min_ratio: 0.95
      momentum: 0.95
      mc_algo: hmc
      prior_solver: gaussian
    operator:
      name: blind_blur
      kernel_size: 64
      intensity: 3.0
      sigma: 0.05
  sd:
    mcmc_sampler_config:
      num_steps: 40
      lr: 1.0e-05
      tau: 0.01
      lr_min_ratio: 1
      momentum: 0.9
      mc_algo: hmc
      prior_solver: gaussian
    operator:
      name: blind_blur
      kernel_size: 64
      intensity: 3.0
      sigma: 0.01
sampler:
  latent: false
  blind: true
  nonlinear: false
  annealing_scheduler_config:
    name: edm
    num_steps: 200
    sigma_max: 100
    sigma_min: 0.1
    timestep: poly-7
  diffusion_scheduler_config:
    name: edm
    num_steps: 5
    sigma_min: 0.01
    timestep: poly-7
