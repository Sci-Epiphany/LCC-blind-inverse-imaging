      lr: 2.7e-06
      lr_min_ratio: 0.95
      mc_algo: hmc
      momentum: 0.95
      num_steps: 35
      prior_solver: gaussian
      tau: 0.01
    operator:
      intensity: 3.0
      kernel_size: 64
      name: blind_blur
      sigma: 0.05
  pixel:
    mcmc_sampler_config:
      lr:
        image: 0.0001
        kernel: 8.0e-09
      lr_min_ratio:
