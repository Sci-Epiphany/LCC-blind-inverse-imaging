        kernel: 0.01
      mc_algo: langevin
      num_steps: 50
      prior_solver:
        image: gaussian
        kernel: gaussian
      reg_terms:
        beta: 2000000
        lamb: 20
      tau: 0.02
    operator:
      intensity: 3.0
      kernel_size: 64
      name: blind_blur
      sigma: 0.02
  sd:
    mcmc_sampler_config:
      lr: 1.0e-05
      lr_min_ratio: 1
      mc_algo: hmc
      momentum: 0.9
      num_steps: 40
      prior_solver: gaussian
      tau: 0.01
    operator:
      intensity: 3.0
      kernel_size: 64
      name: blind_blur
      sigma: 0.01
task_group: pixel
wandb: false
