name: seed42_outer400_mcmc50_x2
num_runs: 1
project_name: BlindDAPS
sampler:
  annealing_scheduler_config:
    name: edm
    num_steps: 400
    sigma_max: 100
    sigma_min: 0.1
    timestep: poly-7
