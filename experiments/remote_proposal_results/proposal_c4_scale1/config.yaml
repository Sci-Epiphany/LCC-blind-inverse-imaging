batch_size: 4
data:
  end_id: 4
  name: image
  resolution: 256
  root: dataset/test-realblur/realblur_n
  start_id: 0
gpu: 0
image_eval_fn_list:
- psnr
- lpips
- ssim
kernel__eval_fn_list:
- kernel_mse
kernel_data:
  intensity: 1.2
  kernel_size:
  - 1
  - 512
  - 2
  - 2
  name: nonlinear_blur
model:
  model_config:
    attention_resolutions: 16
    channel_mult: ''
    class_cond: false
    dropout: 0.0
    image_size: 256
    learn_sigma: true
    model_path: checkpoints/ffhq256.pt
    num_channels: 128
    num_head_channels: 64
    num_heads: 4
    num_heads_upsample: -1
    num_res_blocks: 1
    resblock_updown: true
    use_checkpoint: false
    use_fp16: false
    use_new_attention_order: false
    use_scale_shift_norm: true
  name: ddpm
name: proposal_c4_scale1
num_runs: 1
project_name: BlindDAPS
sampler:
  annealing_scheduler_config:
    name: edm
    num_steps: 200
    sigma_max: 100
    sigma_min: 0.1
    timestep: poly-7
  blind: false
  diffusion_scheduler_config:
    name: edm
    num_steps: 5
    sigma_min: 0.01
    timestep: poly-7
  latent: false
  nonlinear: true
save_dir: tuning_results
save_samples: false
save_traj: false
save_traj_raw_data: false
seed: 42
show_eval: false
task:
  ldm:
    mcmc_sampler_config:
      lr: 2.7e-06
      lr_min_ratio: 0.95
      mc_algo: hmc
      momentum: 0.95
      num_steps: 35
      prior_solver: gaussian
      tau: 0.01
    operator:
      name: blind_nonlinear_blur
      opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
      sigma: 0.02
  pixel:
    mcmc_sampler_config:
      lr:
        image: 1.0e-05
        kernel: 2.0e-09
      lr_min_ratio:
        image: 0.01
        kernel: 0.01
      mc_algo: langevin
      num_steps: 100
      prior_solver: gaussian
      reg_terms:
        beta: 20000000.0
        lamb: 300.0
      tau: 0.02
    operator:
      name: blind_nonlinear_blur
      opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
      proposal_candidates: 4
      proposal_noise_scale: 1.0
      sigma: 0.02
  sd:
    mcmc_sampler_config:
      lr: 1.0e-05
      lr_min_ratio: 1
      mc_algo: hmc
      momentum: 0.9
      num_steps: 40
      prior_solver: gaussian
      tau: 0.01
    operator:
      name: blind_nonlinear_blur
      opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
      sigma: 0.02
task_group: pixel
wandb: false
